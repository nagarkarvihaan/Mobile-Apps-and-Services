name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    environment: testflight
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful full CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f status=success \
            --jq '[.workflow_runs[] | select(.event != "pull_request")] | length')
          if [ "$passed" -eq 0 ]; then
            echo 'Run the Build, test, and deploy workflow successfully for this commit before uploading.'
            exit 1
          fi
      - name: Run Swift tests
        run: swift test --package-path ios/FoodTracker
      - name: Generate temporary keychain password
        run: python3 scripts/prepare_signing.py --password
      - name: Install signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 scripts/prepare_signing.py
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/foodtracker.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/foodtracker.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/foodtracker.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/foodtracker.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/foodtracker.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/foodtracker.keychain-db" login.keychain-db
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 scripts/prepare_signing.py --profile
      - name: Archive signed Release build
        run: |
          xcodebuild archive \
            -project ios/FoodTracker/FoodTracker.xcodeproj -scheme FoodTracker \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/FoodTracker.xcarchive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/foodtracker.keychain-db"
      - name: Upload to App Store Connect
        run: |
          xcodebuild -exportArchive \
            -archivePath build/FoodTracker.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/foodtracker.keychain-db" || true
          python3 scripts/prepare_signing.py --cleanup

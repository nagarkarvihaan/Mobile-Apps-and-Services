name: Build, test, and deploy

on:
  push:
    branches: [main, Aaron_branch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend tests and container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts
      - run: python -m pytest -q --junitxml=../build/backend-tests.xml
        working-directory: backend
      - name: Test deployment automation
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build backend container
        run: docker build --tag foodtracker-api:test backend
      - name: Smoke test container
        run: |
          docker run --detach --name foodtracker-api --publish 8000:8000 foodtracker-api:test
          trap 'docker logs foodtracker-api; docker stop foodtracker-api' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8000/health; then
              curl --fail --silent http://localhost:8000/api/meals
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: build/backend-tests.xml

  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Swift logic on macOS
        run: swift test --package-path ios/FoodTracker
      - name: Select an installed iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as source:
              devices = json.load(source)['devices']
          phones = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No iPhone simulator is installed on this runner.')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + phones[0]['udid'] + '\n')
          PY
      - name: Run Swift tests
        run: |
          xcodebuild test \
            -project ios/FoodTracker/FoodTracker.xcodeproj \
            -scheme FoodTracker \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/FoodTracker \
            -resultBundlePath build/FoodTrackerTests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Build Release for physical devices
        run: |
          xcodebuild archive \
            -project ios/FoodTracker/FoodTracker.xcodeproj \
            -scheme FoodTracker -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FoodTracker.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent build/FoodTracker.xcarchive build/FoodTracker-unsigned.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-and-tests
          path: |
            build/FoodTracker-unsigned.zip
            build/FoodTrackerTests.xcresult
          retention-days: 14

  deploy:
    name: Deploy backend to Render
    needs: [backend, ios]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Gemini and deploy the tested commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_CS4261 }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: python scripts/deploy_render.py
